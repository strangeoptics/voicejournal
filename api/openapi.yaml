openapi: 3.0.3
info:
  title: Voice Journal Local REST API
  version: 1.0.0
  description: >
    Shared REST API contract between the Android embedded Ktor server
    (app/src/main/java/com/example/voicejournal/WebServer.kt) and the Node.js
    web client (web/). This file is the single source of truth for endpoints,
    query limits, and DTO schemas.
servers:
  - url: http://localhost:8080
    description: Local Android device or port-forwarded emulator (adb forward tcp:8080 tcp:8080)

paths:
  /categories:
    get:
      operationId: getCategories
      summary: List all categories
      responses:
        "200":
          description: List of all categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoryDto"

  /journalentries:
    get:
      operationId: getJournalEntries
      summary: List paginated active journal entries
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
      responses:
        "200":
          description: Page of active journal entries ordered newest-first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JournalEntryDto"
    post:
      operationId: createJournalEntry
      summary: Create a new journal entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateJournalEntryDto"
      responses:
        "201":
          description: Entry created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntryDto"
        "500":
          description: Could not retrieve the newly created entry
          content:
            text/plain:
              schema:
                type: string

  /journalentries/category/{id}:
    get:
      operationId: getJournalEntriesByCategory
      summary: List paginated active journal entries for a category
      parameters:
        - name: id
          in: path
          required: true
          description: Numeric category ID
          schema:
            type: integer
            format: int32
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
      responses:
        "200":
          description: Page of active journal entries in the given category
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JournalEntryDto"
        "400":
          description: Invalid or missing category ID
          content:
            text/plain:
              schema:
                type: string

  /journalentries/{id}:
    get:
      operationId: getJournalEntryById
      summary: Fetch a single active journal entry by UUID
      parameters:
        - $ref: "#/components/parameters/EntryIdParam"
      responses:
        "200":
          description: Matching journal entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntryDto"
        "400":
          description: Invalid or missing entry ID
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: Entry not found
          content:
            text/plain:
              schema:
                type: string
    put:
      operationId: updateJournalEntry
      summary: Update an existing journal entry
      parameters:
        - $ref: "#/components/parameters/EntryIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JournalEntryDto"
      responses:
        "200":
          description: Entry updated
        "400":
          description: Invalid or missing entry ID
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: Entry not found
          content:
            text/plain:
              schema:
                type: string
    delete:
      operationId: deleteJournalEntry
      summary: Soft-delete a journal entry (moves entry to recycle bin)
      parameters:
        - $ref: "#/components/parameters/EntryIdParam"
      responses:
        "204":
          description: Entry soft-deleted
        "400":
          description: Invalid or missing entry ID
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: Entry not found
          content:
            text/plain:
              schema:
                type: string

components:
  parameters:
    EntryIdParam:
      name: id
      in: path
      required: true
      description: Journal entry UUID
      schema:
        type: string
        format: uuid
    PageParam:
      name: page
      in: query
      required: false
      description: 1-based page number (clamped to >= 1)
      schema:
        type: integer
        format: int32
        minimum: 1
        default: 1
    PageSizeParam:
      name: pageSize
      in: query
      required: false
      description: Number of entries per page (clamped by server to 1..500)
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 500
        default: 10

  schemas:
    CategoryDto:
      type: object
      additionalProperties: false
      required:
        - id
        - category
        - aliases
        - showAll
        - orderIndex
        - color
        - checkable
        - showDate
        - deleteLineOnDoubleTap
      properties:
        id:
          type: integer
          format: int32
        category:
          type: string
          description: Canonical category display name
        aliases:
          type: string
          description: Comma-separated voice recognition aliases
        showAll:
          type: boolean
          deprecated: true
          description: Legacy column kept for schema/API compatibility
        orderIndex:
          type: integer
          format: int32
          description: Sort order ascending
        color:
          type: string
          description: Hex color string (e.g. "#FFFFFF")
        checkable:
          type: boolean
          description: Enables To-Do checkbox mode for entries in this category
        showDate:
          type: boolean
          description: Controls whether day date headers are shown for this category
        deleteLineOnDoubleTap:
          type: boolean
          description: Enables shopping-list line-deletion mode on double tap

    JournalEntryDto:
      type: object
      additionalProperties: false
      required:
        - id
        - content
        - start_datetime
        - hasImage
        - checked
        - categoryIds
      properties:
        id:
          type: string
          format: uuid
        content:
          type: string
        start_datetime:
          type: integer
          format: int64
          description: Entry start timestamp in UTC epoch milliseconds
        stop_datetime:
          type: integer
          format: int64
          nullable: true
          description: Optional entry end timestamp in UTC epoch milliseconds
        hasImage:
          type: boolean
        checked:
          type: boolean
          default: false
        categoryIds:
          type: array
          items:
            type: integer
            format: int32
        zoneId:
          type: string
          nullable: true
          description: Optional IANA timezone ID (e.g. "Europe/Berlin"); null falls back to device/local timezone

    CreateJournalEntryDto:
      type: object
      additionalProperties: false
      required:
        - content
        - start_datetime
        - hasImage
        - categoryIds
      properties:
        content:
          type: string
        start_datetime:
          type: integer
          format: int64
          description: Entry start timestamp in UTC epoch milliseconds
        stop_datetime:
          type: integer
          format: int64
          nullable: true
          description: Optional entry end timestamp in UTC epoch milliseconds
        hasImage:
          type: boolean
        checked:
          type: boolean
          default: false
        categoryIds:
          type: array
          items:
            type: integer
            format: int32
        zoneId:
          type: string
          nullable: true
          description: Optional IANA timezone ID (e.g. "Europe/Berlin")
